
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #202b46;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .container {
            padding: 35px 6%;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .card h3 {
            margin-bottom: 12px;
            color: #202b46;
        }

        .card a {
            color: #3159c9;
            text-decoration: none;
            font-weight: bold;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h2>Coaching Management System</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">
    <div class="welcome">
        <h1 id="teacherName">Teacher Dashboard</h1>
        <p>Welcome! Manage your coaching activities from here.</p>
    </div>

    <div class="cards">
        <div class="card">
            <h3>Students</h3>
            <a href="students.html">Manage Students</a>
        </div>

        <div class="card">
            <h3>Courses</h3>
            <a href="courses.html">Manage Courses</a>
        </div>

        <div class="card">
            <h3>Batches</h3>
            <a href="batches.html">Manage Batches</a>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <a href="attendance.html">Manage Attendance</a>
        </div>

        <div class="card">
            <h3>Fees</h3>
            <a href="fees.html">Manage Fees</a>
        </div>

        <div class="card">
            <h3>Marks</h3>
            <a href="marks.html">Manage Marks</a>
        </div>

        <div class="card">
            <h3>Teachers</h3>
            <a href="teachers.html">Manage Teachers</a>
        </div>
    </div>
</div>

<script>
    const teacherData = sessionStorage.getItem("loggedInTeacher");

    if (!teacherData) {
        window.location.href = "login.html";
    } else {
        const teacher = JSON.parse(teacherData);
        document.getElementById("teacherName").textContent =
            "Welcome, " + (teacher.name || teacher.username);
    }

    async function logout() {
        try {
            await fetch("/teachers/logout", {
                method: "POST",
                credentials: "same-origin"
            });
        } catch (error) {
            console.error("Logout error:", error);
        }

        sessionStorage.removeItem("loggedInTeacher");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
