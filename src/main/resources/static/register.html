
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration - Coaching Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-container {
            width: 450px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #d5d5d5;
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 18px;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #1f2937;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 8px 0 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .register-btn:disabled {
            background: #93aeea;
            cursor: not-allowed;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .register-container {
                padding: 28px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="logo">CMS</div>

    <h1>Create Teacher Account</h1>

    <div class="subtitle">
        Coaching Management System
    </div>

    <form id="registerForm">

        <label for="id">Teacher ID</label>
        <input
            type="number"
            id="id"
            placeholder="Enter teacher ID"
            min="1"
            required
        >

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Create username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="6"
            required
        >

        <button type="submit" class="register-btn" id="registerBtn">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

    <div class="footer">
        Java Spring Boot + MySQL
    </div>

</div>

<script>
    const registerForm = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const teacher = {
            id: Number(document.getElementById("id").value),
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
        };

        if (
            teacher.id <= 0 ||
            !teacher.name ||
            !teacher.email ||
            !teacher.username ||
            teacher.password.length < 6
        ) {
            alert("Please enter valid details. Password must be at least 6 characters.");
            return;
        }

        registerBtn.disabled = true;
        registerBtn.textContent = "Creating Account...";

        try {
            const response = await fetch("/teachers/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(teacher)
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Registration error:", response.status, errorText);

                throw new Error(
                    "Registration failed. HTTP status: " + response.status
                );
            }

            alert("Teacher account created successfully!");
            window.location.href = "index.html";

        } catch (error) {
            console.error("Registration error:", error);
            alert(error.message || "Registration failed. Please try again.");

        } finally {
            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";
        }
    });
</script>

</body>
</html>
